[project]
name = "smartdown"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "orjson>=3.10.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pymupdf4llm>=1.27.2.2",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "markdown>=3.5.0",
  "html2docx>=1.6.0",
]

[tool.setuptools.packages.find]
include = ["smartdown*"]
